<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pixelflux</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #394244;
        }
        #fileSelector {
            margin-bottom: 20px;
            padding: 15px 30px;
            border: 2px solid #65f2fc;
            border-radius: 5px;
            background-color: #55787c;
            color: #51dbf3;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
    }
     #fileSelector:hover {
            background-color: #3a9b86;
            color: #fff;
    }  

     #fileSelector:hover {
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.5);
            transform: translateY(-2px);
    }   

/* Estilos para las opciones dentro del select (aunque pueden no ser totalmente efectivos en todos los navegadores) */
select#fileSelector option {
  padding: 5px 10px; 
  font-size: 14px; 
}

/* Estilo para el elemento "Seleccione" */
select#fileSelector option[value=""] {
  color: #999;
}

/* Estilos para la lista personalizada (si estás utilizando la estructura de lista) */
.custom-select {
  position: relative;
  display: inline-block;
}

.custom-select ul {
  display: none;
  position: absolute;
  background-color: #fff;
  border: 15px solid #ccc;
  border-top: none;
  z-index: 1;
}

.custom-select li {
  padding: 10px 20px;
  cursor: pointer;
  &:hover {
    background-color: #f1f1f1;
  }
}
    </style>
</head>
<body>
    <select id="fileSelector">
        <option> 
            <ul value=""> playlist
                <li></li>
                <li></li>
                <li></li>
              </ul>
        </option>
    </select>
    <video id="video-player" class="video-js" controls preload="auto" width="940" height="560" data-setup='{}'>
        <source src="" type="application/x-mpegURL">
    </video>

    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script>
        // Cargar lista de archivos HLS desde el servidor
        fetch('/hls-files')
            .then(response => response.json())
            .then(files => {
                const fileSelector = document.getElementById('fileSelector');
                files.forEach(file => {
                    const option = document.createElement('option');
                    option.value = file.url;
                    option.textContent = file.name;
                    fileSelector.appendChild(option);
                });

                fileSelector.addEventListener('change', (event) => {
                    const selectedUrl = event.target.value;
                    const videoPlayer = videojs('video-player');
                    if (selectedUrl) {
                        videoPlayer.src({ src: selectedUrl, type: 'application/x-mpegURL' });
                        videoPlayer.play();
                    } else {
                        videoPlayer.pause();
                        videoPlayer.src('');
                    }
                });
            })
            .catch(err => {
                console.error('Error al cargar playlist:', err);
                alert('No hay playlist.');
            });

        // Manejador de errores de red para la reproducción
        const videoPlayer = videojs('video-player');
        videoPlayer.on('error', function(error) {
            console.error('Error de reproducción:', error);
        });
    </script>
</body>
</html>
